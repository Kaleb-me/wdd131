<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
     rel="stylesheet">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="A recipe book full of my favorite foods">
    <meta property="og:url" content="kaleb-me.github.io/wdd131/recipes/index.html">
    <meta property="og:image" content="./images/apple-crisp.jpg">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="A recipe book full of my favorite foods">
    <meta name="twitter:image" content="./images/apple-crisp.jpg">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="./images/recipe-book.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/recipe-book.png">

</head>
<body>
    <header>
        <div class="title">
            <img src="images/recipe-book.png" alt="recipe book logo">
            <h1>RecipeBook</h1>
        </div>
        
        <nav>
            <div class="search">
                <input id="searchbar" name="searchbar" type="text" placeholder="Find a recipe"/>
                <button><img src="images/search.svg" alt="magnifying glass icon"></button>
            </div>
        </nav>
    </header>
    <hr>
    <main class="recipe-card-container">
        <div class="recipe-card">
            <img src="images/apple-crisp.jpg" alt="apple crisp dessert with ice cream">
            <div class="review">
                <p class="tag">Dessert</p>
                <h2>Apple Crisp</h2>
                <span
                class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars"
                >
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>
                <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's
                great served warm with vanilla ice cream.</p>
            </div>
        </div>
    </main>
    <footer>                            
        <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>              
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>    
    </footer>
</body>
</html>
